<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGS - Indonesian Generation School</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Logo / Badge -->
        <div class="logo-badge" data-aos="zoom-in">
            <div class="badge-ring"></div>
            <div class="badge-inner">
                <span class="badge-text">IGS</span>
            </div>
        </div>

        <!-- Title Section -->
        <div class="title-section">
            <h1 class="main-title">
                <span class="title-line" data-text="INDONESIAN">INDONESIAN</span>
                <span class="title-line highlight" data-text="GENERATION">GENERATION</span>
                <span class="title-line" data-text="SCHOOL">SCHOOL</span>
            </h1>
            <div class="subtitle-wrapper">
                <span class="subtitle">Welcome to IGS Official Portal</span>
                <div class="subtitle-underline"></div>
            </div>
        </div>

        <!-- Navigation Cards -->
        <div class="nav-grid">
            <a href="role.html" class="nav-card" data-delay="0">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <h3>ROLE</h3>
                    <p>Struktur Organisasi & Jabatan</p>
                    <div class="card-arrow">→</div>
                </div>
            </a>

            <a href="rules.html" class="nav-card" data-delay="1">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                    <h3>RULES</h3>
                    <p>Peraturan & Ketentuan IGS</p>
                    <div class="card-arrow">→</div>
                </div>
            </a>

            <a href="event.html" class="nav-card" data-delay="2">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <h3>EVENT</h3>
                    <p>Event & Perlombaan Agustusan</p>
                    <div class="card-arrow">→</div>
                </div>
            </a>

            <a href="links.html" class="nav-card" data-delay="3">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </div>
                    <h3>LINK</h3>
                    <p>Discord & TikTok Official</p>
                    <div class="card-arrow">→</div>
                </div>
            </a>
        </div>

        <!-- Footer -->
        <footer class="main-footer">
            <p>© 2026 Indonesian Generation School. All Rights Reserved.</p>
            <div class="footer-glow"></div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
