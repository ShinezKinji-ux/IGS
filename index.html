<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGS - Indonesian Gakuran School</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-japan">
        <div class="sakura-petal" style="left:10%;animation-delay:0s;"></div>
        <div class="sakura-petal" style="left:20%;animation-delay:2s;"></div>
        <div class="sakura-petal" style="left:30%;animation-delay:4s;"></div>
        <div class="sakura-petal" style="left:40%;animation-delay:1s;"></div>
        <div class="sakura-petal" style="left:50%;animation-delay:3s;"></div>
        <div class="sakura-petal" style="left:60%;animation-delay:5s;"></div>
        <div class="sakura-petal" style="left:70%;animation-delay:0.5s;"></div>
        <div class="sakura-petal" style="left:80%;animation-delay:2.5s;"></div>
        <div class="sakura-petal" style="left:90%;animation-delay:4.5s;"></div>
        <div class="sakura-petal" style="left:15%;animation-delay:6s;"></div>
        <div class="sakura-petal" style="left:45%;animation-delay:7s;"></div>
        <div class="sakura-petal" style="left:75%;animation-delay:8s;"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="main-wrapper">
        <div class="hero-section">
            <div class="logo-glitch" data-text="IGS">
                <span class="logo-main">IGS</span>
                <span class="logo-red">IGS</span>
                <span class="logo-blue">IGS</span>
            </div>

            <div class="title-block">
                <div class="tag-line">
                    <span class="jp-text">インドネシア</span>
                    <span class="en-text">OFFICIAL PORTAL</span>
                </div>
                <h1 class="hero-title glitch-title" data-text="INDONESIAN GENERATION SCHOOL">
                    <span class="word">INDONESIAN</span>
                    <span class="word highlight" data-text="GENERATION">GENERATION</span>
                    <span class="word">SCHOOL</span>
                </h1>
                <div class="title-divider">
                    <span class="divider-line"></span>
                    <span class="divider-kanji">学</span>
                    <span class="divider-line"></span>
                </div>
                <p class="hero-desc">Gakuran School Roleplay Community</p>
            </div>

            <div class="nav-cards">
                <a href="role.html" class="nav-card japan-red">
                    <div class="card-shine"></div>
                    <div class="card-border"></div>
                    <div class="card-inner">
                        <div class="card-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <h3>役割</h3>
                        <p>ROLE</p>
                        <div class="card-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </a>

                <a href="rules.html" class="nav-card japan-black">
                    <div class="card-shine"></div>
                    <div class="card-border"></div>
                    <div class="card-inner">
                        <div class="card-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                            </svg>
                        </div>
                        <h3>規則</h3>
                        <p>RULES</p>
                        <div class="card-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </a>

                <a href="event.html" class="nav-card japan-gold">
                    <div class="card-shine"></div>
                    <div class="card-border"></div>
                    <div class="card-inner">
                        <div class="card-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                        </div>
                        <h3>イベント</h3>
                        <p>EVENT</p>
                        <div class="card-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </a>

                <a href="links.html" class="nav-card japan-white">
                    <div class="card-shine"></div>
                    <div class="card-border"></div>
                    <div class="card-inner">
                        <div class="card-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                            </svg>
                        </div>
                        <h3>リンク</h3>
                        <p>LINK</p>
                        <div class="card-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <footer class="site-footer">
            <div class="footer-content">
                <div class="footer-brand glitch-footer" data-text="IGS">IGS</div>
                <p>© 2026 Indonesian Gakuran School</p>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
  </html>
